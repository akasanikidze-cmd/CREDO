const pull=()=>fetch(API).then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error('სერვერმა JSON არ დააბრუნა (Apps Script-ის წვდომა/დეპლოი)')}O=j;mig();apply();if(!AD&&CE==null&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))draw();st('✔ სინქრონიზებულია '+tm())}).catch(e=>st('⚠ ჩატვირთვა ვერ მოხერხდა: '+e.message));
let O={},DB=null,V='mg',F0='all',AD=false,CE=null;const KEY='q4v2';
const today=new Date().toISOString().slice(0,10),dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const BASE=T.slice();
const apply=()=>{T=BASE.concat(Object.keys(O).filter(k=>k[0]=='n'&&O[k]&&O[k].def&&!O[k].del).map(k=>Object.assign({i:k},O[k].def)));T.forEach(t=>Object.assign(t,{s:'todo',p:0,a:'2026-10-01',b:t.due,c:'',ct:'',k:0,at:''},O[t.i]||{}))};
const done=t=>t.tg!=null&&RK[t.s]>=RK[t.tg],late=t=>t.tg!=null&&!done(t)&&t.b<today;
const risk=t=>t.tg!=null&&!done(t)&&!late(t)&&dd(today,t.b)<=14&&t.p<70;
const flag=t=>t.k?['blk','დაბლოკილია']:done(t)?['ok','მიზნამდე'] :late(t)?['late-c','ვადაგადასული']:risk(t)?['risk','რისკი']:['na','—'];
const sugg=(s,tg)=>{const sp=ST[RK[s]][2];if(!tg)return sp;const tp=ST[RK[tg]][2];return RK[s]>=RK[tg]?100:Math.round(sp/tp*100)};
const pct=a=>{const w=a.reduce((x,t)=>x+(t.d||5),0);return w?Math.round(a.reduce((x,t)=>x+(t.d||5)*t.p,0)/w):0};
const sum=(a,f)=>a.reduce((x,t)=>x+f(t),0),fm=n=>n.toLocaleString('en-US'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=t=>`style="--c:var(--${t.team})"`;
function save(i,patch){const nv={...(O[i]||{}),...patch,at:new Date().toISOString()};O[i]=nv;apply();
 if(API)push(i,nv);else if(DB)DB.doc('tasks/t'+i).set(nv).catch(()=>{});else{try{localStorage.setItem(KEY,JSON.stringify(O))}catch(e){}}draw()}
document.addEventListener('change',e=>{const g=e.target,i=g.dataset.i,k=g.dataset.k;if(i==null)return;const t=T.find(x=>String(x.i)===i);if(!t)return;
 if(k=='s')save(i,{s:g.value,p:sugg(g.value,t.tg)});else if(k=='k')save(i,{k:g.checked?1:0});
 else if(k=='c'){CE=null;save(i,{c:g.value.trim(),ct:new Date().toISOString()})}
 else if(k=='d')save(i,{d:g.value===''?null:+g.value});else if(k=='v')save(i,{v:g.value===''?0:+g.value});
 else save(i,{[k]:k=='p'?+g.value:g.value})});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=b.dataset.i;
 if(a=='ec'){CE=i;draw();const x=document.querySelector('textarea[data-i="'+i+'"]');if(x)x.focus()}

document.addEventListener('focusout',e=>{if(e.target.tagName=='TEXTAREA')setTimeout(()=>{if(CE!=null){CE=null;draw()}},200)});

function tools(){const b=(k,n)=>`<button class="${V==k?'on':''}" onclick="V='${k}';draw()">${n}</button>`;

function mg(){const all=T,tot=pct(all),reach=all.filter(done).length,tgt=all.filter(t=>t.tg).length,lt=all.filter(late).length,bl=all.filter(t=>t.k).length,rs=all.filter(risk).length;
 const vp=sum(all,t=>Math.max(t.v,0)),vd=sum(all.filter(done),t=>Math.max(t.v,0));
 const kp=(l,v,x='')=>`<div class="kpi"><div class="kl">${l}</div><div class="kv">${v}</div>${x}</div>`;
 let h='<div class="kgrid">'+kp('საერთო პროგრესი',tot+'%',`<div class="bar"><i style="width:${tot}%"></i></div>`)+kp('მიზნამდე მისული',`${reach}<small> / ${tgt}</small>`)+kp('ვადაგადასული / რისკი',`<span class="${lt?'neg':''}">${lt}</span><small> / ${rs}</small>`,bl?`<span class="chip blk">${bl} დაბლოკილი</span>`:'')+kp('შექმნილი ღირებულება',`${fm(vd)}<small> / ${fm(vp)} ₾</small>`)+'</div>';
 h+='<h2>გუნდები და მსხვილი თემები</h2><div class="tgrid">'+Object.entries(TM).map(([k,n])=>{const a=T.filter(t=>t.team==k),p=pct(a),dys=sum(a,t=>t.d||0),ld=Math.round(dys/CAP[k]*100),v=sum(a,t=>Math.max(t.v,0)),vk=sum(a.filter(done),t=>Math.max(t.v,0)),l=a.filter(late).length;
 const th=grp(a).map(g=>({n:g[0].th,d:sum(g,t=>t.d||0),p:pct(g),c:g.length,dn:g.filter(done).length})).sort((x,y)=>y.d-x.d);
 return `<section class="tc" style="--c:var(--${k})"><div class="tch" onclick="V='ls';F0='${k}';draw()"><span class="dot"></span><b>${n}</b><span class="tp">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>
<div class="chips"><span class="pill ${ld>100?'bad':''}">${dys}/${CAP[k]} დღე · ${ld}%</span>${v?`<span class="pill">${fm(vk)} / ${fm(v)} ₾</span>`:''}${l?`<span class="pill bad">ვადაგადასული ${l}</span>`:''}</div>
<div class="tt">მსხვილი თემები</div>${th.map(x=>`<div class="th2"><div class="tn">${esc(x.n)}<small>${x.d?x.d+' დღე · ':''}${x.dn}/${x.c} ამოცანა მიზნამდე</small></div><div class="tb"><div class="bar s"><i style="width:${x.p}%"></i></div><b>${x.p}%</b></div></div>`).join('')}</section>`}).join('')+'</div>';
 const up=T.filter(t=>t.at).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,6);
 h+='<h2>ბოლო განახლებები</h2>'+(up.length?up.map(t=>`<div class="up"><b>${TM[t.team]}</b> · ${esc(t.t)} → ${ST[RK[t.s]][1]}, ${t.p}%${t.c?' · '+esc(t.c):''} <small>${t.at.slice(0,10)}</small></div>`).join(''):'<div class="note">კაპიტნების განახლებები ჯერ არ არის.</div>');
 return h}
const grp=a=>{const m={};a.forEach(t=>{(m[t.team+'|'+t.th]=m[t.team+'|'+t.th]||[]).push(t)});return Object.values(m)};
const tg=t=>t.tg?ST[RK[t.tg]][1]:'—';
function panel(){const th=[...new Set(BASE.map(t=>t.th))];return `<div class="ad"><b>ახალი ამოცანის დამატება</b><div class="adg"><label>გუნდი<select id="ad_team">${Object.entries(TM).map(([k,n])=>`<option value="${k}"${F0==k?' selected':''}>${n}</option>`).join('')}</select></label><label>ტიპი<select id="ad_type"><option value="nw">ახალი ამოცანა</option><option value="oos">Out of scope</option></select></label><label>თემა<input id="ad_th" list="ad_ths" placeholder="არსებული ან ახალი თემა"><datalist id="ad_ths">${th.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label class="w2">სახელი<input id="ad_t" placeholder="ამოცანის დასახელება"></label><label>ეფორტი (დღე)<input id="ad_d" type="number" min="0"></label><label>ღირებულება ₾<input id="ad_v" type="number" min="0"></label><label>Target<select id="ad_tg"><option value="">—</option>${ST.slice(1).map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label><label>ვადა<input id="ad_b" type="date" value="2026-12-31"></label></div><div class="adb"><button data-act="mk" style="background:var(--ac);color:#fff">დამატება</button><button data-act="add">გაუქმება</button></div></div>`}
function addTask(){const g=x=>document.getElementById(x).value.trim(),t=g('ad_t');if(!t){alert('ჩაწერე ამოცანის სახელი');return}
 const oos=g('ad_type')=='oos',id='n'+Date.now().toString(36),d=g('ad_d'),v=g('ad_v'),b=g('ad_b')||'2026-12-31',team=g('ad_team'),th=oos?'Out of scope':(g('ad_th')||'ახალი ამოცანები'),tgt=g('ad_tg')||null;
 AD=false;F0=team;save(id,{def:{team,th,t,d:d===''?null:+d,v:v===''?0:+v,tg:tgt,due:b,note:oos?'Out of scope':'ახალი',x:0,oos:oos?1:0,nw:oos?0:1},s:'todo',p:0,a:today,b})}
function ls(a){return (AD?panel():'')+'<div class="scroll"><div class="hd"><span>ამოცანა</span><span>ეფორტი</span><span>₾</span><span>Target</span><span>სტატუსი</span><span>პროგრესი</span><span>დაწყება</span><span>ვადა</span><span>🚫</span><span>კომენტარი</span><span>ნიშანი</span></div>'+grp(a).map(g=>`<div class="th" ${col(g[0])}><b>${TM[g[0].team]} · ${esc(g[0].th)}</b><div class="bar s"><i style="width:${pct(g)}%"></i></div><span class="tag">${pct(g)}%</span></div>`+g.map(t=>{const f=flag(t),I=`data-i="${t.i}"`,cu=String(t.i)[0]=='n',em=t.oos?'<em class="oos">out of scope</em>':t.nw?'<em class="nw">ახალი</em>':t.x?'<em>extra</em>':'';
 const cc=CE==t.i?`<textarea ${I} data-k="c" rows="3" placeholder="დაწერე კომენტარი...">${esc(t.c)}</textarea>`:t.c?`<div class="cmt" data-act="ec" ${I} title="რედაქტირება">${esc(t.c)}<small>${t.ct?t.ct.slice(0,10)+' · ':''}✎ რედაქტირება</small></div>`:`<button class="ghost" data-act="ec" ${I}>+ კომენტარი</button>`;
 return `<div class="task ${late(t)?'late':''}" ${col(t)}><div class="tt1"><b>${esc(t.t)}${em}</b><small>${esc(t.note)}${t.at?' · განახლდა '+t.at.slice(0,10):''}</small>${cu?`<button class="ghost" data-act="del" ${I} title="წაშლა">🗑 წაშლა</button>`:''}</div>
<div class="meta"><label class="f"><b>ეფორტი (დღე)</b><input type="number" min="0" ${I} data-k="d" value="${t.d==null?'':t.d}" placeholder="?"></label><label class="f"><b>ღირებულება ₾</b><input type="number" min="0" ${I} data-k="v" value="${t.v>0?t.v:''}" placeholder="${t.v<0?'TBD':'—'}"></label><label class="f"><b>Target</b><span>${tg(t)}</span></label></div>
<label class="f"><b>სტატუსი</b><select ${I} data-k="s">${ST.map(s=>`<option value="${s[0]}"${s[0]==t.s?' selected':''}>${s[1]}</option>`).join('')}</select></label>
<label class="f"><b>პროგრესი</b><span class="rg"><input type="range" min="0" max="100" step="5" ${I} data-k="p" value="${t.p}"><small>${t.p}%</small></span></label>
<label class="f"><b>დაწყება</b><input type="date" ${I} data-k="a" value="${t.a}"></label><label class="f"><b>ვადა</b><input type="date" ${I} data-k="b" value="${t.b}"></label>
<label class="f"><b>დაბლოკილი</b><input type="checkbox" ${I} data-k="k"${t.k?' checked':''}></label>
<div class="f cm"><b>კომენტარი</b>${cc}</div><span class="chip ${f[0]}">${f[1]}</span></div>`}).join('')).join('')+'</div>'}
function tl(a){const X=d=>Math.max(0,Math.min(100,dd('2026-10-01',d)/151*100)),M=[['ოქტ',31],['ნოე',30],['დეკ',31],['იან',31],['თებ',28]];
 return '<div class="lg"><span>ბარი = დაწყება → ვადა, შევსება = პროგრესი</span><span>◆ ვადა</span><span style="color:var(--rd)">წითელი კონტური = ვადაგადასული</span></div><div class="scroll"><div class="tl"><div class="tr"><div></div><div class="months">'+M.map(m=>`<span style="width:${m[1]/151*100}%">${m[0]}</span>`).join('')+'</div></div>'+
 grp(a).map(g=>`<div class="tr" ${col(g[0])}><div><b>${TM[g[0].team]} · ${esc(g[0].th)}</b> <span class="tag">${pct(g)}%</span></div><div class="lane"></div></div>`+g.map(t=>`<div class="tr" ${col(t)}><div title="${esc(t.t)}">&nbsp;&nbsp;${esc(t.t)}</div><div class="lane"><div class="seg ${late(t)?'late':''}" style="left:${X(t.a)}%;width:${Math.max(1,X(t.b)-X(t.a))}%"><i style="width:${t.p}%"></i></div><span class="dm" style="left:${X(t.b)}%"></span></div></div>`).join('')).join('')+
 `<div class="today" style="left:calc(var(--lw) + (100% - var(--lw))*${X(today)/100})"></div></div></div>`}

try{O=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const LOC=JSON.parse(JSON.stringify(O));

(async()=>{const m=document.getElementById('mode');
 if(API){st('სინქრონიზაცია...');pull();setInterval(pull,20000);return}
 try{DB=await claude.use('db')}catch(e){DB=null}

  DB.collection('tasks').onSnapshot(sn=>{sn.docs.forEach(d=>{const i=+d.id.slice(1);if(T[i])O[i]=d.data()});apply();draw()},()=>{})}
 else m.textContent='· ლოკალური რეჟიმი: ცვლილებები ინახება მხოლოდ ამ ბრაუზერში'})();
</script></body></html>
