<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q4 2026 – ამოცანების ტრეკერი</title>
<style>
:root{--bg:#f5f7fb;--sf:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e6eaf2;--ac:#4f46e5;--crm:#4f6bff;--db:#f59e0b;--ncpo:#10b981;--sme:#8b5cf6;--rd:#ef4444;--gn:#10b981;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);--lw:270px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--sf:#171b22;--tx:#e8ecf3;--mu:#8a94a6;--bd:#262c36;--sh:0 1px 2px rgba(0,0,0,.4);--ac:#818cf8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--sf:#171b22;--tx:#e8ecf3;--mu:#8a94a6;--bd:#262c36;--sh:0 1px 2px rgba(0,0,0,.4);--ac:#818cf8;color-scheme:dark}
{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;width:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI",Inter,"Noto Sans Georgian",system-ui,sans-serif;-webkit-font-smoothing:antialiased;width:100%;max-width:100vw;overflow-x:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
header,.tools,main{max-width:1280px;margin:0 auto;width:100%;box-sizing:border-box}header{padding:20px 16px 4px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}h2{font-size:13px;color:var(--mu);font-weight:600;margin:24px 0 10px}.sub{color:var(--mu);font-size:12px;margin-top:2px}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;white-space:nowrap;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);scrollbar-width:none;max-width:100%}
main{padding:0 16px 32px;overflow:hidden}.scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}.sep{width:1px;background:var(--bd);margin:2px 6px;flex:none}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;max-width:100%}
button{cursor:pointer;border-radius:999px;border-color:transparent;box-shadow:var(--sh);flex:none;padding:7px 14px}button.on{background:var(--ac);color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpi,.tc,.up{background:var(--sf);border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.kl{color:var(--mu);font-size:12px}.kv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px}.kv small{font-size:13px;font-weight:500;color:var(--mu)}.neg{color:var(--rd)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ac))}.bar.s{height:6px}
.tc{border-top:4px solid var(--c)}.tch{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px}.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}.tch b{font-size:16px;flex:1}.tp{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.pill{font-size:11px;background:var(--bg);border-radius:99px;padding:2px 10px;color:var(--mu)}.pill.bad{background:#ef444420;color:var(--rd);font-weight:600}
.tt{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.th2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--bd)}.tn{flex:1;min-width:0;font-weight:600}.tn small{display:block;font-weight:400}
.tb{display:flex;align-items:center;gap:8px;width:42%}.tb .bar{flex:1}.tb b{width:38px;text-align:right}
.up{margin-bottom:8px;padding:10px 14px}small,.tag{color:var(--mu)}
.th{margin:18px 0 8px;display:flex;align-items:center;gap:10px}.th b{font-size:13px}.th .bar{flex:0 0 120px}
.task,.hd{display:grid;grid-template-columns:minmax(180px,2.2fr) 68px 96px 96px 118px 130px 124px 124px 36px minmax(180px,2.2fr) 90px;gap:8px;align-items:start;min-width:1020px}
.task{background:var(--sf);border-radius:12px;border-left:4px solid var(--c);box-shadow:var(--sh);padding:8px 12px;margin-bottom:6px}.task.late{box-shadow:inset 0 0 0 1.5px var(--rd)}
.hd{color:var(--mu);font-size:11px;padding:0 16px}.tt1 b{display:block}.tt1 small{display:block}.meta{display:contents}.f b{display:none}.f{display:block}.rg{display:flex;align-items:center;gap:6px}
.task input[type=range]{width:90px;padding:0;border:0;background:none}.task input[type=date],.task input[type=text]{width:100%}
.task em{font-size:10px;background:var(--db);color:#fff;border-radius:4px;padding:0 5px;margin-left:6px;font-style:normal}
.chip{font-size:11px;border-radius:99px;padding:2px 9px;color:#fff;text-align:center;white-space:nowrap;display:inline-block}.ok{background:var(--gn)}.late-c{background:var(--rd)}.risk{background:var(--db)}.blk{background:#7a1f1f}.na{background:var(--mu);opacity:.5}
.tl{min-width:600px;position:relative}.tr{display:grid;grid-template-columns:var(--lw) 1fr;align-items:center}
.months{display:flex;text-align:center;font-weight:600;border-bottom:1px solid var(--bd);padding:4px 0}.months span{border-left:1px solid var(--bd)}
.lane{position:relative;height:26px;border-bottom:1px dashed var(--bd)}.tr>div:first-child{font-size:12px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:absolute;top:5px;height:16px;border-radius:6px;background:var(--c);opacity:.28;overflow:hidden}.seg i{display:block;height:100%;background:var(--c)}.seg.late{outline:2px solid var(--rd)}
.dm{position:absolute;top:6px;width:10px;height:10px;background:var(--tx);transform:rotate(45deg);margin-left:-5px}.today{position:absolute;top:0;bottom:0;width:2px;background:var(--rd);z-index:2}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:6px 0 10px}.note{font-size:12px;color:var(--mu)}
@media(max-width:1100px){:root{--lw:120px}.kgrid{grid-template-columns:1fr 1fr}.kv{font-size:22px}.tgrid{grid-template-columns:1fr}.hd{display:none}.tb{width:46%}
.task{grid-template-columns:1fr 1fr;min-width:0;gap:10px}.tt1,.meta,.cm,.task>.chip{grid-column:1/-1}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;grid-column:1/-1}
.f b{display:block;font-size:11px;color:var(--mu);font-weight:500;margin-bottom:2px}.f select,.f input[type=date]{width:100%}.task input[type=range]{width:100%;flex:1}.tl{min-width:560px}.task>.chip{justify-self:start}}
@media(max-width:600px){.kgrid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.tl{min-width:520px}}
.task input[type=number]{width:100%}textarea{width:100%;min-height:72px;resize:vertical;line-height:1.45}
.cmt{background:var(--bg);border-left:3px solid var(--c);border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;font-size:13px;cursor:pointer}.cmt small{display:block;margin-top:4px;font-size:11px}
.ghost{background:none;box-shadow:none;border:1px dashed var(--bd);color:var(--mu);border-radius:10px;padding:4px 10px;font-size:12px}
.task em.oos{background:var(--rd)}.task em.nw{background:var(--ac)}.tt1 .ghost{margin-top:4px}
.ad{background:var(--sf);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;margin:6px 0 14px}.adg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}.ad label{display:block;font-size:11px;color:var(--mu)}.ad input,.ad select{width:100%;margin-top:2px}.w2{grid-column:span 2}.adb{display:flex;gap:8px}
</style></head><body>

<div class="tools" id="tools"></div><main id="main"></main>
